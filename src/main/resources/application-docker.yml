server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/VD?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:vd_user}
    password: ${SPRING_RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  # Mail configuration for alerts
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

# Actuator configuration for metrics
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,env
  endpoint:
    health:
      show-details: always
  simple:
    metrics:
      export:
        enabled: true

app:
  upload:
    base-path: ${APP_UPLOAD_BASE_PATH:/app/uploads}
    cover-path: covers
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:15}
      refresh-expiry-minutes: ${JWT_REFRESH_EXPIRY_MINUTES:10080}
  messaging:
    dev-mode-trigger: false
  logging:
    es:
      scheme: ${LOG_ES_SCHEME:http}
      host: ${LOG_ES_HOST:elasticsearch}
      port: ${LOG_ES_PORT:9200}
      index-pattern: ${LOG_ES_INDEX_PATTERN:volunteer-duration-*}
      business-index-prefix: ${LOG_ES_BUSINESS_INDEX_PREFIX:volunteer-business-log}
      business-index-template: ${LOG_ES_BUSINESS_INDEX_TEMPLATE:volunteer-business-log-template}
      business-ilm-policy: ${LOG_ES_BUSINESS_ILM_POLICY:volunteer-business-log-ilm}
      ilm-retention-days: ${LOG_ES_ILM_RETENTION_DAYS:30}
      business-shards: ${LOG_ES_BUSINESS_SHARDS:1}
      business-replicas: ${LOG_ES_BUSINESS_REPLICAS:1}
      fallback-buffer-size: ${LOG_ES_FALLBACK_BUFFER_SIZE:5000}
      fallback-flush-batch-size: ${LOG_ES_FALLBACK_FLUSH_BATCH_SIZE:300}
      fallback-flush-ms: ${LOG_ES_FALLBACK_FLUSH_MS:5000}
  monitoring:
    ws:
      max-connections: ${MONITOR_WS_MAX_CONNECTIONS:2000}
      sample-rate: ${MONITOR_WS_SAMPLE_RATE:1}
      degrade-threshold: ${MONITOR_WS_DEGRADE_THRESHOLD:1500}
    sse:
      max-connections: ${MONITOR_SSE_MAX_CONNECTIONS:500}

# 閺冦儱绻旈柊宥囩枂
logging:
  level:
    site.arookieofc: DEBUG
    org.springframework.amqp: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"



