server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml

spring:
  web:
    resources:
      static-locations: file:./frontend/web/, classpath:/static/
      chain:
        strategy:
          content:
            enabled: true
        cache: true
      cache:
        cachecontrol:
          max-age: 30d
          cache-public: true
          must-revalidate: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/vd?allowPublicKeyRetrieval=TRUE&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5673}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,env
  endpoint:
    health:
      show-details: always
  simple:
    metrics:
      export:
        enabled: true

app:
  upload:
    base-path: data/uploads
    cover-path: covers
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-me-jwt-secret-32-chars}
      access-expiry-minutes: 15
      refresh-expiry-minutes: 10080
  messaging:
    dev-mode-trigger: true
  logging:
    service-name: volunteer-duration
    environment: bundle
    elk:
      host: localhost
      port: 5001
    es:
      scheme: http
      host: localhost
      port: 9201
      index-pattern: volunteer-duration-*
      business-index-prefix: volunteer-business-log
      business-index-template: volunteer-business-log-template
      business-ilm-policy: volunteer-business-log-ilm
      ilm-retention-days: 30
      business-shards: 1
      business-replicas: 1
      fallback-buffer-size: 2000
      fallback-flush-batch-size: 200
      fallback-flush-ms: 5000
  monitoring:
    ws:
      max-connections: 1000
      sample-rate: 1
      degrade-threshold: 800
    sse:
      max-connections: 300

mybatis:
  configuration:
    lazy-loading-enabled: true
    aggressive-lazy-loading: false

logging:
  level:
    root: INFO
    site.arookieofc: INFO

