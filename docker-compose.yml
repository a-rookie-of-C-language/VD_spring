services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: VD
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: vd_user
      RABBITMQ_DEFAULT_PASS: vd_pass
    ports:
      - "5672:5672"
      - "15672:15672"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    depends_on:
      - elasticsearch
    environment:
      LS_ES_HOST: elasticsearch
      LS_ES_PORT: 9200
    ports:
      - "5000:5000"
    volumes:
      - ./deploy/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./deploy/elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  app:
    build: .
    depends_on:
      - mysql
      - rabbitmq
      - elasticsearch
      - logstash
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/VD?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: vd_user
      SPRING_RABBITMQ_PASSWORD: vd_pass
      JWT_SECRET: change-me-to-a-long-random-secret
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  elasticsearch-data:
