services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: VD
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: vd_user
      RABBITMQ_DEFAULT_PASS: vd_pass
    ports:
      - "5672:5672"
      - "15672:15672"

  app:
    build: .
    depends_on:
      - mysql
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/VD?allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: vd_user
      SPRING_RABBITMQ_PASSWORD: vd_pass
      JWT_SECRET: change-me-to-a-long-random-secret
    ports:
      - "8080:8080"

volumes:
  mysql-data:
